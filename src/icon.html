<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム画面アイコン（apple-touch-icon）の元</title>
<!-- 180×180 の apple-touch-icon を作るための元ファイル。?v=hs か ?v=adv で版を切り替える。
     PNGへの書き出し方は CLAUDE.md を参照（Chrome のヘッドレスでスクリーンショット）。
     iPhone は角を自動で丸めるので、ここでは四角いまま・透明なしで作る。 -->
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Old+Mincho:wght@900&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#000}
.icon{position:relative;width:180px;height:180px;overflow:hidden}
.icon svg.b{position:absolute;inset:0;width:180px;height:180px}
.word{position:absolute;left:16px;top:36px;width:148px;height:92px;display:grid;place-items:center;line-height:1;letter-spacing:0;white-space:nowrap}
.tape{position:absolute;left:4px;top:30px;width:58px;height:20px;transform:rotate(-38deg);
  clip-path:polygon(0 0,100% 0,96% 20%,100% 40%,96% 60%,100% 80%,96% 100%,0 100%,4% 80%,0 60%,4% 40%,0 20%)}

/* 高校生版：紺の地に青〜紫の光と細かいドット、黄色のふきだし */
.hs{background:
  radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.4px) 0 0/12px 12px,
  radial-gradient(70% 70% at 96% 0%,rgba(139,92,246,.9),transparent 70%),
  radial-gradient(65% 65% at 0% 100%,rgba(59,91,255,.85),transparent 70%),
  radial-gradient(50% 42% at 78% 108%,rgba(255,95,162,.55),transparent 70%),
  #11133a}
.hs .word{font-family:"Dela Gothic One",sans-serif;font-size:40px;color:#14163a}
.hs .tape{background:rgba(255,255,255,.62)}

/* 中〜上級版：黒に近い地に細い方眼と朱色の光、朱色のふきだしに明朝 */
.adv{background:
  linear-gradient(rgba(255,255,255,.065) 1px,transparent 1px) 0 0/100% 18px,
  linear-gradient(90deg,rgba(255,255,255,.065) 1px,transparent 1px) 0 0/18px 100%,
  radial-gradient(75% 75% at 100% 0%,rgba(224,72,45,.5),transparent 65%),
  radial-gradient(60% 60% at 0% 100%,rgba(64,140,130,.38),transparent 70%),
  #101315}
.adv .word{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:42px;color:#f4f2ec}
.adv .tape{background:rgba(244,242,236,.5)}
</style>
</head>
<body>
<div class="icon" id="icon">
  <svg class="b" viewBox="0 0 180 180" aria-hidden="true">
    <defs>
      <linearGradient id="adv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2502f"/><stop offset="1" stop-color="#c4351f"/></linearGradient>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".38"/></filter>
    </defs>
    <g filter="url(#sh)" id="fill">
      <rect x="16" y="36" width="148" height="92" rx="26"/>
      <path d="M44 120 L36 152 Q37 156 41 153 L80 122 Z"/>
    </g>
  </svg>
  <div class="word">英会話</div>
  <div class="tape"></div>
</div>
<script>
const v = new URLSearchParams(location.search).get("v") === "adv" ? "adv" : "hs";
document.getElementById("icon").className = "icon " + v;
document.getElementById("fill").setAttribute("fill", v === "adv" ? "url(#adv)" : "#ffd84d");
</script>
</body>
</html>
